<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robert Sösemann · Public work</title>
  <link rel="stylesheet" href="tools/timeline.css">
  <script src=".archive/exports/timeline-data.js" defer></script>
  <script src="tools/timeline.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div><p class="masthead-label">Public work</p><h1>Robert Sösemann</h1></div>
      <span class="private-label">Private archive</span>
    </div>
  </header>
  <div class="page-scroll" id="page-scroll">
    <main>
      <section class="timeline-section" aria-label="Activity and career timeline">
        <div class="timeline-axis">
          <nav id="years" class="years" aria-label="Archived works by year"></nav>
          <div id="career-bands" aria-label="Employment periods"></div>
        </div>
      </section>
      <section class="filter-panel" aria-label="Find archived work">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Search the archive" placeholder="Search a topic, person, or talk…"></label>
        <div class="filter-row"><span class="filter-label" id="format-label">Format</span><div id="filters" class="filters" aria-labelledby="format-label"></div></div>
        <div class="filter-row"><span class="filter-label" id="topic-label">Topic</span><div id="topic-filters" class="filters" aria-labelledby="topic-label"></div></div>
        <div class="filter-row"><span class="filter-label" id="platform-label">Platform</span><div id="platform-filters" class="filters" aria-labelledby="platform-label"></div></div>
      </section>
      <section class="collection" aria-label="Selected year">
        <p id="results" class="sr-only" role="status"></p>
        <div id="timeline"></div>
        <p id="empty" class="empty" hidden>No matches. Try another topic or format.</p>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>
  </div>
  <dialog id="reader">
    <div class="reader-header"><span id="reader-format"></span><button id="close-reader" aria-label="Close item">✕</button></div>
    <div class="reader-scroll">
      <h2 id="reader-title"></h2><p id="reader-context"></p>
      <div id="reader-media"></div>
      <div id="reader-links" class="reader-links"></div>
      <p id="reader-abstract" class="session-abstract" hidden></p>
      <pre id="reader-text"></pre>
      <section id="reader-sources"></section>
    </div>
  </dialog>
</body>
</html>
